services:
  api:
    build: .
    env_file: .env
    environment:
      AUTH_ENABLED: "false" # Set true with real API keys outside the local demo.
    ports:
      - "8000:8000"
    volumes:
      - meridian_artifacts:/app/artifacts

  ui:
    build: .
    env_file: .env
    command: ["/app/.venv/bin/streamlit", "run", "src/copilot/ui.py", "--server.address", "0.0.0.0"]
    environment:
      COPILOT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

volumes:
  meridian_artifacts:
