[project]
name = "payments-scam-copilot"
version = "0.1.0"
description = "A governed, synthetic-data payment-scam review copilot."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "streamlit>=1.39,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "langchain>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langgraph>=0.6.11,<1.0",
    "langgraph-checkpoint-sqlite>=2.0.7,<3.0",
    "langsmith>=0.1,<1.0",
    "langchain-community>=0.3,<1.0",
    "langchain-text-splitters>=0.3,<1.0",
    "langchain-chroma>=0.1,<1.0",
    "chromadb>=0.5,<1.0",
    "sentence-transformers>=3.1,<4.0",
    "mcp>=1.0,<2.0",
    "structlog>=24.4,<26.0",
    "opentelemetry-api>=1.27,<2.0",
    "prometheus-client>=0.21,<1.0",
    "pinecone>=7.0,<8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]
evals = [
    "deepeval>=1.0,<3.0",
    "ragas>=0.2,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
